{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}RecetApp{% endblock %}</title>
    <link 
        rel="stylesheet" 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    >
    <link rel="stylesheet" href="{% static 'apps/css/style.css' %}">
</head>
<body>
<nav class="navbar navbar-expand-lg shadow-sm px-4" 
     style="background-color: #8f8b8ba4">
    <div class="container-fluid">
                                                <!-- LOGO -->
        <a class="navbar-brand d-flex align-items-center" href="/">
            <img 
                src="{% static 'apps/imagenes/logo.png' %}" alt="Logo" 
                style="height: 40px; margin-right: 10px;"
            >
            <span style="font-weight: bold;">RecetApp</span>
        </a>

                                                <!-- BOTÓN CERRAR SESIÓN -->
        <div class="d-flex ms-auto">
            <a href="/logout" class="btn btn-outline-dark"
            style="background-color: transparent; border-color: transparent;">Cerrar sesión
            </a>
        </div>

    </div>
</nav>

{% comment %} 
                                                <!-- VIDEO DE AYUDA -->
   <div class="video-box shadow p-3">
    <h5 class="text-center mb-3">Video de ayuda</h5>
        
        <video controls class="w-100" style="max-height: 280px; border-radius: 8px;">
        <source src="{% static '' %}" type="video/mp4">
        <p>tu navegador no puede presentar este video por favor descargalo des <a href="{% static '' %}"></a>AQUI</p>
         </video>
    </div><style>
    .video-box {
        width: 350px;         
        position: absolute;    
        top: 100px;             
        right: 20px;           
        background-color: #b2acac;
        border-radius: 10px;
    } 
</style> {% endcomment %}

<div style="margin-top: 420px; padding: 20px;">
    {% block content %}
    {% endblock %}
</div>

   

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
