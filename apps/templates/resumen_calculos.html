{% extends 'base.html' %} {% load static %} {% block content %}
<div class="contenedor-central">
  <h2 class="text-center">Crear resumen</h2>

  <form method="POST">
    {% csrf_token %}

    <div class="container mt-4">
      <!-- ===================================================== -->
      <!-- FILA 1: FECHA + COMENSALES -->
      <!-- ===================================================== -->
      <div class="row g-3 justify-content-center">
        <div class="col-6 col-md-3">
          <label class="form-label"><strong>Fecha Receta:</strong></label>
          <input type="date" class="form-control" name="fecha_receta" />
        </div>

        <div class="col-6 col-md-3">
          <label class="form-label"><strong>N° Comensales:</strong></label>
          <input
            type="number"
            id="input-comensales"
            class="form-control"
            name="comensales"
            min="1"
          />
        </div>
      </div>

      <!-- ===================================================== -->
      <!-- FILA 2: TIPO COMIDA + RECETA -->
      <!-- ===================================================== -->
      <div class="row g-3 justify-content-center mt-2">
        <div class="col-12 col-md-4">
          <label class="form-label"><strong>Tipo de Comida:</strong></label>
          <select id="tipoComida" class="form-select" name="tipo_comida">
            <option value="">Seleccione una opción</option>
            {% for tipo in tipos_comida %}
            <option value="{{ tipo.id_tipo_comida }}">{{ tipo.nombre }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="col-12 col-md-4">
          <label class="form-label"><strong>Elige una Receta:</strong></label>
          <select id="receta" class="form-select" name="receta">
            <option value="">Seleccione una receta</option>
          </select>
        </div>
      </div>

      <!-- ===================================================== -->
      <!-- FILA 3: SEGUNDA REPETICIÓN (si la necesitas) -->
      <!-- ===================================================== -->
      <div class="row g-3 justify-content-center mt-2">
        <div class="col-12 col-md-4">
          <label class="form-label"><strong>Tipo de Comida:</strong></label>
          <select
            id="tipoComida2"
            class="form-select"
            disabled
            name="tipo_comida_2"
          >
            <option value="">Seleccione una opción</option>
            {% for tipo in tipos_comida %}
            <option value="{{ tipo.id_tipo_comida }}">{{ tipo.nombre }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="col-12 col-md-4">
          <label class="form-label"><strong>Elige una Receta:</strong></label>
          <select id="receta2" class="form-select" disabled name="receta_2">
            <option value="">Seleccione una receta</option>
          </select>
        </div>
      </div>

      <!-- ===================================================== -->
      <!-- FILA 4: BOTONES CALCULAR / AGREGAR -->
      <!-- ===================================================== -->
      <div class="row g-3 justify-content-center mt-3">
        <div class="col-6 col-md-3 d-grid">
          <button type="button" class="btn btn-success" id="calcular">
            Calcular
          </button>
        </div>

        <div class="col-6 col-md-3 d-grid">
          <button
            type="button"
            id="btn-agregar"
            class="btn btn-purple"
            style="background: #8a2be2; color: white"
          >
            Agregar
          </button>
        </div>
      </div>

      <!-- ===================================================== -->
      <!-- FILA 5: BOTÓN INFORME -->
      <!-- ===================================================== -->
  <div class="row g-3 justify-content-center mt-4">
      <div class="col-6 col-md-4 d-grid">
          <button type="button" id="btn-informe-receta" class="btn btn-info">
              <i class="bi bi-journal-text"></i> Resumen por Receta
          </button>
      </div>
      <div class="col-6 col-md-4 d-grid">
          <button type="button" id="btn-informe-total" class="btn btn-success">
              <i class="bi bi- calculator"></i> Resumen Total
          </button>
      </div>
  </div>

  <hr />

  <div class="container mt-4" style="display: none" id="seccionIngredientes">
    <h4 class="mb-3 text-center">Ingredientes Calculados</h4>

    <div class="table-responsive">
      <table
        class="table table-hover align-middle text-center shadow-sm rounded-3"
        id="tablaIngredientes"
      >
        <thead class="table-primary rounded-3">
          <tr>
            <th>Ingrediente</th>
            <th>Cantidad Base</th>
            <th>Cantidad Total</th>
            <th>Unidad</th>
          </tr>
        </thead>
        <tbody id="tbodyIngredientes">
          <!-- Aquí JS insertará las filas -->
        </tbody>
      </table>
    </div>
  </div>

  <div class="container mt-4" id="seccionAcumulados" style="display: none;">
    <hr />
    <h4 class="mb-3 text-center" style="color: #8a2be2;">Resumen para el Informe</h4>
    <div class="table-responsive">
      <table class="table table-bordered align-middle text-center shadow-sm">
        <thead class="table-dark">
          <tr>
            <th>Fecha</th>
            <th>Recetas Seleccionadas</th>
            <th>Comensales</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody id="tbodyAcumulados">
          </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    // =========================================================
    // 1. CONFIGURACIÓN DE IDs (¡REVISA ESTO CON TU BASE DE DATOS!)
    // =========================================================
    const ID_PROTEINA = 2; // Ejemplo: Almuerzo - Fondo
    const ID_GUARNICION = 3; // Ejemplo: Almuerzo - Acompañamiento
    const ID_COMPUESTO = 5; // Ejemplo: Almuerzo - Completo

    // IDs que bloquean totalmente la segunda fila
    const dashabilitados = [1, 4, ID_COMPUESTO];

    // =========================================================
    // 2. SELECTORES
    // =========================================================
    const selectTipo = document.getElementById("tipoComida");
    const selectReceta = document.getElementById("receta");

    const selectTipo2 = document.getElementById("tipoComida2");
    const selectReceta2 = document.getElementById("receta2");

    const botonCalcular = document.getElementById("calcular");
    const btnInforme = document.getElementById("btn-generar-informe");
    const inputComensales = document.getElementById("input-comensales");
    const inputFecha = document.querySelector('input[name="fecha_receta"]');

    const seccionIngredientes = document.getElementById("seccionIngredientes");
    const tbody = document.getElementById("tbodyIngredientes");

    // =========================================================
    // 3. FUNCIÓN DE MENSAJE AMIGABLE (MEJORADA)
    // =========================================================
    const toggleMensajeAyuda = (mostrar) => {
      let msg = document.getElementById("msg-ayuda-fila2");

      if (mostrar) {
        if (!msg) {
          // Creamos un contenedor de ancho completo
          msg = document.createElement("div");
          msg.id = "msg-ayuda-fila2";
          msg.className = "col-12 text-center mt-3"; // Centrado y con margen arriba

          // Contenido: Un mensaje estilo "Alerta Suave"
          msg.innerHTML = `
                    <div class="alert alert-success py-2 d-inline-block shadow-sm" style="border-radius: 20px;">
                        <i class="bi bi-check-circle-fill me-2"></i> 
                        ¡Listo! Esta opción es un menú completo. 
                        <strong>No necesitas seleccionar nada en esta fila.</strong>
                    </div>
                `;

          // Buscamos la FILA (row) donde están los selects 2 para pegarlo abajo
          const parentRow = selectTipo2.closest(".row");
          if (parentRow) {
            parentRow.appendChild(msg);
          }
        }
      } else {
        if (msg) msg.remove();
      }
    };

    // =========================================================
    // 4. LÓGICA PRINCIPAL (Cambio en Fila 1)
    // =========================================================
    if (selectTipo) {
      selectTipo.addEventListener("change", function () {
        const tipoId = parseInt(this.value);

        // A. Limpieza inicial
        selectReceta.innerHTML = `<option value="">Cargando...</option>`;
        selectTipo2.value = "";
        selectReceta2.innerHTML = `<option value="">Seleccione una receta</option>`;

        // Bloqueo preventivo
        selectTipo2.disabled = true;
        selectReceta2.disabled = true;

        if (!tipoId) {
          selectReceta.innerHTML = `<option value="">Seleccione una receta</option>`;
          toggleMensajeAyuda(false);
          return;
        }

        // B. Decisión: ¿Bloquear o Habilitar?
        if (dashabilitados.includes(tipoId)) {
          // CASO 1: Bloqueado (Desayuno/Once/Compuesto)
          selectTipo2.disabled = true;
          selectReceta2.disabled = true;

          // Mostrar mensaje centrado abajo
          toggleMensajeAyuda(true);
        } else {
          // CASO 2: Habilitado (Proteína/Guarnición)
          toggleMensajeAyuda(false); // Ocultar mensaje

          selectTipo2.disabled = false;
          selectReceta2.disabled = false;

          // Reset visual (mostrar todo)
          Array.from(selectTipo2.options).forEach(
            (option) => (option.hidden = false)
          );

          // Filtro Cruzado
          if (tipoId === ID_PROTEINA) {
            Array.from(selectTipo2.options).forEach((option) => {
              if (option.value != ID_GUARNICION && option.value != "")
                option.hidden = true;
            });
          } else if (tipoId === ID_GUARNICION) {
            Array.from(selectTipo2.options).forEach((option) => {
              if (option.value != ID_PROTEINA && option.value != "")
                option.hidden = true;
            });
          }
        }

        // C. Cargar recetas Fila 1
        fetch(`/recetas-por-tipo/${tipoId}/`)
          .then((r) => r.json())
          .then((data) => {
            selectReceta.innerHTML = `<option value="">Seleccione una receta</option>`;
            data.forEach((r) => {
              selectReceta.innerHTML += `<option value="${r.id_receta}">${r.nombre}</option>`;
            });
          })
          .catch((e) => console.error("Error cargando recetas 1:", e));
      });
    }

    // =========================================================
    // 5. LÓGICA DE CARGA RECETAS FILA 2 (Sin cambios)
    // =========================================================
    if (selectTipo2) {
      selectTipo2.addEventListener("change", function () {
        const tipoId = this.value;
        selectReceta2.innerHTML = `<option value="">Cargando...</option>`;

        if (!tipoId) {
          selectReceta2.innerHTML = `<option value="">Seleccione una receta</option>`;
          return;
        }

        fetch(`/recetas-por-tipo/${tipoId}/`)
          .then((r) => r.json())
          .then((data) => {
            selectReceta2.innerHTML = `<option value="">Seleccione una receta</option>`;
            data.forEach((r) => {
              selectReceta2.innerHTML += `<option value="${r.id_receta}">${r.nombre}</option>`;
            });
          })
          .catch((e) => console.error(e));
      });
    }

    // =========================================================
    // 6. BOTÓN CALCULAR (Tabla)
    // =========================================================
    if (botonCalcular) {
      botonCalcular.addEventListener("click", function () {
        const csrfToken = document.querySelector(
          'input[name="csrfmiddlewaretoken"]'
        ).value;

        if (!selectReceta.value) {
          alert("Por favor, seleccione al menos la primera receta.");
          return;
        }

        const payload = {
          receta_id: selectReceta.value,
          comensales: inputComensales.value || 1,
          receta_dos:
            !selectReceta2.disabled && selectReceta2.value
              ? selectReceta2.value
              : null,
          tipo_dos:
            !selectTipo2.disabled && selectTipo2.value
              ? selectTipo2.value
              : null,
        };

        fetch(`/calcular-por-tipo/`, {
          method: "POST",
          body: JSON.stringify(payload),
          headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": csrfToken,
          },
        })
          .then((response) => {
            if (!response.ok) throw new Error("Err");
            return response.json();
          })
          .then((data) => {
            tbody.innerHTML = "";
            const dibujarFilas = (lista) => {
              if (!lista) return;
              lista.forEach((item) => {
                tbody.innerHTML += `
                      <tr>
                          <td>${item.ingrediente}</td>
                          <td>${item.cantidad_base}</td>
                          <td class="fw-bold text-primary">${item.cantidad_total}</td>
                          <td>${item.unidad}</td>
                      </tr>`;
              });
            };
            if (data.calculo) dibujarFilas(data.calculo);
            if (data.calculo_dos) dibujarFilas(data.calculo_dos);
            seccionIngredientes.style.display = "block";
          })
          .catch((error) => {
            alert("Error al calcular.");
          });
      });
    }

    // =========================================================
    // 7. BOTÓN INFORME (PDF desde Sesión)
    // =========================================================
    const btnInformeReceta = document.getElementById("btn-informe-receta");
    const btnInformeTotal = document.getElementById("btn-informe-total");

    if (btnInformeReceta) {
        btnInformeReceta.addEventListener("click", () => {
            window.open('/generar-informe/?tipo=detalle', '_blank');
        });
    }

    if (btnInformeTotal) {
        btnInformeTotal.addEventListener("click", () => {
            window.open('/generar-informe/?tipo=total', '_blank');
        });
    }
    // =========================================================
    // 8. LÓGICA PARA AGREGAR RECETAS AL RESUMEN (SESIÓN)
    // =========================================================
    const btnAgregar = document.getElementById("btn-agregar");
    const seccionAcumulados = document.getElementById("seccionAcumulados");
    const tbodyAcumulados = document.getElementById("tbodyAcumulados");

    // Función para "dibujar" la tabla de resumen con lo que hay en la sesión
    const actualizarTablaResumen = (lista) => {
        if (!lista || lista.length === 0) {
            seccionAcumulados.style.display = "none";
            return;
        }

        tbodyAcumulados.innerHTML = ""; // Limpiamos la tabla antes de dibujar
        let ultimaFecha = ""; // Variable para detectar cuándo cambia el día

        lista.forEach((item, index) => {
            // LÓGICA DE SEPARADOR DE DÍA (Punto 2 de la coordinadora)
            // Si la fecha de esta receta es distinta a la anterior, ponemos un encabezado
            if (item.fecha !== ultimaFecha) {
                const filaFecha = document.createElement("tr");
                filaFecha.innerHTML = `
                    <td colspan="4" class="table-secondary text-center py-2" style="background-color: #e9ecef; border-top: 2px solid #6f42c1;">
                        <strong class="text-dark">
                            <i class="bi bi-calendar3"></i> Preparaciones para el: ${formatearFechaLarga(item.fecha)}
                        </strong>
                    </td>`;
                tbodyAcumulados.appendChild(filaFecha);
                ultimaFecha = item.fecha; // Guardamos esta fecha para comparar con la siguiente
            }

            // Dibujamos la fila normal de la receta
            const fila = document.createElement("tr");
            fila.innerHTML = `
                <td>${item.fecha}</td>
                <td class="text-start">${item.nombres}</td>
                <td>${item.comensales}</td>
                <td>
                    <button type="button" class="btn btn-sm btn-outline-danger" onclick="eliminarDelResumen(${index})">
                        <i class="bi bi-trash"></i> Quitar
                    </button>
                </td>
            `;
            tbodyAcumulados.appendChild(fila);
        });

        seccionAcumulados.style.display = "block"; // Mostramos la tabla
    };

    // Esta función ayuda a que la fecha se vea "lunes, 15 de febrero" en vez de "2026-02-15"
    function formatearFechaLarga(fechaStr) {
        if(!fechaStr) return "Sin fecha";
        const opciones = { weekday: 'long', day: 'numeric', month: 'long' };
        const fecha = new Date(fechaStr + "T12:00:00"); 
        return fecha.toLocaleDateString('es-ES', opciones);
    };

    // Acción al presionar el botón "Agregar"
    if (btnAgregar) {
        btnAgregar.addEventListener("click", function () {
            const csrfToken = document.querySelector('input[name="csrfmiddlewaretoken"]').value;

            // Validamos que al menos la primera receta esté seleccionada
            if (!selectReceta.value) {
                alert("Selecciona una receta antes de agregarla al informe.");
                return;
            }

            const payload = {
                fecha: inputFecha.value || new Date().toISOString().split('T')[0],
                comensales: inputComensales.value || 1,
                receta_id: selectReceta.value,
                receta_dos_id: (!selectReceta2.disabled && selectReceta2.value) ? selectReceta2.value : null,
                // Enviamos los nombres para que la tabla se vea bien de inmediato
                nombre1: selectReceta.options[selectReceta.selectedIndex].text,
                nombre2: selectReceta2.options[selectReceta2.selectedIndex]?.text
            };

            fetch('/agregar-al-resumen/', {
                method: "POST",
                body: JSON.stringify(payload),
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": csrfToken,
                },
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'ok') {
                    actualizarTablaResumen(data.recetas);
                    // Opcional: limpiar los selects para la siguiente receta
                    selectTipo.value = "";
                    selectReceta.innerHTML = '<option value="">Seleccione una receta</option>';
                    toggleMensajeAyuda(false);
                }
            })
            .catch(error => console.error("Error al agregar:", error));
        });
    }

    // Función global para eliminar ítems (se llama desde el botón de la tabla)
    window.eliminarDelResumen = function(index) {
        fetch(`/eliminar-receta-resumen/${index}/`)
            .then(r => r.json())
            .then(data => actualizarTablaResumen(data.recetas));
    };

    // Cargar datos automáticamente al abrir la página por si ya había algo guardado
    fetch('/obtener-acumulados/')
        .then(r => r.json())
        .then(data => actualizarTablaResumen(data.recetas));
  });
</script>

{% endblock %}
