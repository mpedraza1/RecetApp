{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="contenedor-central">

    <h2>Crear Nueva Receta</h2>
    {% if messages %}
        <ul style="list-style: none; padding: 0; margin-bottom: 20px;">
            {% for message in messages %}
                <li style="padding: 10px; margin-bottom: 5px; border-radius: 4px; 
                    {% if message.tags == 'error' %} 
                        background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb;
                    {% else %} 
                        background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; 
                    {% endif %}">
                    {{ message }}
                </li>
            {% endfor %}
        </ul>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

    
    <form method="POST">
        {% csrf_token %}
        
        <label class="campo">
            <strong>Nombre de la receta:</strong><br>
            <input type="text" name="nombre_receta" placeholder="Ingrese el nombre de la nueva receta">
        </label>

        <label class="campo" >
            <strong>Tipo de comida:</strong><br>
            <select name="tipo_comida" style= "border-radius: 6px !important; padding: 10px;" >
                <option value="">Seleccione una opción</option>

          
                {% for tipo in tipos_comida %}
                    <option value="{{ tipo.id_tipo_comida }}">{{ tipo.nombre }}</option>
                {% endfor %}
            </select>
        </label>

        <br><br>

        <strong>Ingresar ingredientes:</strong>
        
        <div id="ingredientes-container">

          
            <div class="ingrediente">

                <select class="ingrediente-select" name="ingrediente" style="width: auto;">
                    
                    <option value="" data-unidad="">Seleccione un ingrediente</option>
                    {% for ingrediente in ingredientes %}
                        <option value="{{ ingrediente.id_ingrediente }}" data-unidad="{{ ingrediente.unidad_base }}">
                            {{ ingrediente.nombre }}
                        </option>
                    {% endfor %}
                    </select>

    
                <input class="cantidad" type="number" step="0.01" min="0" name="cantidad" placeholder="Cantidad">

                <input class="input-unidad" type="text" name="unidad" readonly 
                       style="width: 50px; background-color: #e9ecef; border: 1px solid #ced4da; text-align: center;" 
                       placeholder="-">
                <button type="button" class="boton-mas">+</button>
            </div>

        </div>

        <br>


        <button class="guardar" type="submit">Guardar</button>

    </form>

</div>


<script>
document.addEventListener('DOMContentLoaded', function() {

    const ingredientesContainer = document.getElementById('ingredientes-container');
    const form = document.querySelector("form");

    ingredientesContainer.addEventListener('change', function(event) {
 
        if (event.target.classList.contains('ingrediente-select')) {
            const select = event.target;
            const selectedOption = select.options[select.selectedIndex];
            
     
            const unidad = selectedOption.getAttribute('data-unidad');
         
            const row = select.parentElement;
            
        
            const inputUnidad = row.querySelector('.input-unidad');
            
            if (inputUnidad) {
               
                if (unidad && unidad !== "None" && unidad !== "null") {
                    inputUnidad.value = unidad;
                } else {
                    inputUnidad.value = "";
                }
            }
        }
    });


    ingredientesContainer.addEventListener('click', function(event){

       
        if(event.target.classList.contains('boton-mas')){

            
            const bloque = event.target.parentElement;

            
            const nuevoBloque = bloque.cloneNode(true);

            
            nuevoBloque.querySelector('.cantidad').value = "";
            nuevoBloque.querySelector('.ingrediente-select').selectedIndex = 0;
    
            const inputUnidad = nuevoBloque.querySelector('.input-unidad');
            if (inputUnidad) inputUnidad.value = "";

            ingredientesContainer.appendChild(nuevoBloque);
        }
    });


   
    form.addEventListener("submit", function(event) {

        let errores = [];

       
        const nombre = document.querySelector("input[name='nombre_receta']").value.trim();
        const tipo = document.querySelector("select[name='tipo_comida']").value;
        
    
        const list = Array.from(document.querySelectorAll(".ingrediente"));

        if (nombre === "") errores.push("Debe ingresar un nombre para la receta.");
        if (tipo === "") errores.push("Debe seleccionar un tipo de comida.");

        let vistos = new Set();

        list.forEach((row) => {

            const ingredienteSelect = row.querySelector(".ingrediente-select"); 
            const ingrediente = ingredienteSelect.value;                       
            const cantidad = row.querySelector(".cantidad").value;
            
            
            const unidad = row.querySelector(".input-unidad").value;

         
            if (ingrediente !== "") { 
                if (vistos.has(ingrediente)) {
                   
                    errores.push("Hay ingredientes repetidos (" + ingredienteSelect.options[ingredienteSelect.selectedIndex].text + ").");
                } else {
                    vistos.add(ingrediente);
                }

                
                if (!unidad) {
                    errores.push("El ingrediente '" + ingredienteSelect.options[ingredienteSelect.selectedIndex].text + "' no tiene unidad base (gr/ml) configurada en la base de datos.");
                }
            }

   
            if (cantidad === "" || parseFloat(cantidad) <= 0) {
                errores.push("Las cantidades deben ser mayores a 0.");
            }

           
            if (!unidad) {
                errores.push("Debe seleccionar una unidad para cada ingrediente.");
            }
        });

        if (errores.length > 0) {
            event.preventDefault();
            alert("Errores encontrados:\n\n" + errores.join("\n"));
        }

    });
});
</script>

{% endblock %}
