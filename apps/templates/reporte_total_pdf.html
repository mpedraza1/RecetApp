<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        @page {
            size: letter;
            margin: 1cm;
            @frame footer {
                -pdf-frame-content: footerContent;
                bottom: 0.5cm;
                margin-left: 1cm;
                margin-right: 1cm;
                height: 1cm;
            }
        }
        body { font-family: sans-serif; font-size: 16px; line-height: 1.1; }
        h1 { text-align: center; font-size: 22px; margin-bottom: 10px; }
        .dia-seccion { margin-top: 10px; border-bottom: 1px solid #8a2be2; background-color: #f0f0f0; padding: 3px; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
        th, td { border: 1px solid #666; padding: 2px 5px; text-align: left; }
        th { background-color: #eee; }
        #footerContent { text-align: right; font-size: 10px; }
        .tabla-footer {
        width: 100%;
        border: none !important;
        margin-top: 10px;
        font-size: 10px; }
        .col-izquierda { width: 20%; border: none !important; } 
        .col-centro { width: 60%; text-align: center; border: none !important; } 
        .col-derecha { width: 20%; text-align: right; border: none !important; }
    </style>
</head>
<body>
    <h1>RESUMEN TOTAL POR DÍA</h1>
    
    {% for dia in reporte_por_dia %}
        <div class="dia-seccion">DÍA: {{ dia.fecha }}</div>
        <table>
            <thead>
                <tr>
                    <th width="60%">Ingrediente</th>
                    <th width="20%">Cantidad</th>
                    <th width="20%">Unidad</th>
                </tr>
            </thead>
            <tbody>
                {% for ing in dia.ingredientes %}
                <tr>
                    <td>{{ ing.nombre }}</td>
                    <td>{{ ing.cantidad }}</td>
                    <td>{{ ing.unidad }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    {% endfor %}

    <div id="footerContent">
        <table class="tabla-footer">
            <tr>
                <td class="col-izquierda"></td>
                
                <td class="col-centro">
                    <h4 style="margin: 0;">Generado automáticamente por el sistema RecetApp - Fundación Coanil</h4>
                </td>
                
                <td class="col-derecha">
                    Página <pdf:pagenumber> de <pdf:pagecount>
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
