
services:
  db:
    image: postgres:16
    container_name: recetapp_db
    restart: always
    environment:
      POSTGRES_DB: recetapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Recetapp
      POSTGRES_INITDB_ARGS: --encoding=UTF-8 --lc-collate=C --lc-ctype=C
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: recetapp_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@recetapp.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    depends_on:
      - db

volumes:
  postgres_data: